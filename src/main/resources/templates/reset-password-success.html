<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful - Migration Hub</title>
    <meta http-equiv="refresh" th:content="'3;url=' + ${@environment.getProperty('app.frontend.url', 'http://localhost:3000') + '/login?reset=success'}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        h2 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .success-message {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .redirect-info {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .redirect-info p {
            color: #065f46;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="success-icon">✅</div>

    <div class="logo">
        <h1>🌍 Migration Hub</h1>
    </div>

    <h2>Password Reset Successful!</h2>

    <p class="success-message">
        Your password has been successfully reset. You can now login with your new password.
    </p>

    <div class="redirect-info">
        <p>Redirecting to login page in 3 seconds...</p>
    </div>

    <a href="#"
       th:href="${@environment.getProperty('app.frontend.url', 'http://localhost:3000') + '/login'}"
       class="btn">
        Go to Login Now
    </a>
</div>
</body>
</html>
